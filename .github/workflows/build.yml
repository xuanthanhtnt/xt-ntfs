name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  engine-tests:
    name: Engine tests (Linux, FUSE)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q autoconf automake libtool pkg-config fuse3 libgcrypt20-dev
      - name: Build engine
        run: scripts/ci-run.sh engine/build-ntfs3g.sh "$RUNNER_TEMP/xt"
      - name: Randomized I/O layer stress test (ASan/UBSan, fork, eviction)
        run: |
          SRC="$RUNNER_TEMP/xt/.work/src"
          cc -O2 -g -fsanitize=address,undefined -I"$SRC" -I"$SRC/include/ntfs-3g" -DHAVE_CONFIG_H \
            engine/tests/rawio_stress.c "$SRC/libntfs-3g/xt_rawio.c" "$SRC/libntfs-3g/unix_io.c" \
            "$SRC/libntfs-3g/.libs/libntfs-3g.a" -lpthread -o rawio_stress
          export ASAN_OPTIONS=detect_leaks=0
          for cfg in "512 64 256" "4096 64 256" "512 1 16" "4096 0 256" "512 2 32"; do
            set -- $cfg
            echo "sector=$1 cache=$2MB line=$3KB"
            XTNTFS_SIMULATE_RAW=$1 XTNTFS_CACHE_MB=$2 XTNTFS_LINE_KB=$3 XTNTFS_FLUSH_MS=20 \
              ./rawio_stress "$RUNNER_TEMP/scratch.img" 32 15000 1 $RANDOM
          done
          XTNTFS_SIMULATE_RAW=512 XTNTFS_SIMULATE_ODIRECT=1 ./rawio_stress "$RUNNER_TEMP/scratch.img" 32 15000 1 7
      - name: Thread sanitizer
        run: |
          SRC="$RUNNER_TEMP/xt/.work/src"
          cc -O1 -g -fsanitize=thread -I"$SRC" -I"$SRC/include/ntfs-3g" -DHAVE_CONFIG_H \
            engine/tests/rawio_stress.c "$SRC/libntfs-3g/xt_rawio.c" "$SRC/libntfs-3g/unix_io.c" \
            "$SRC/libntfs-3g/.libs/libntfs-3g.a" -lpthread -o rawio_tsan
          XTNTFS_SIMULATE_RAW=512 XTNTFS_CACHE_MB=2 XTNTFS_FLUSH_MS=1 ./rawio_tsan "$RUNNER_TEMP/scratch.img" 16 8000 0 5
      - name: End-to-end FUSE test
        run: |
          sudo -E env "PATH=$PATH" E2E_WORK="$RUNNER_TEMP/e2e" E2E_SIZE_MB=1024 \
            engine/tests/e2e_linux.sh "$RUNNER_TEMP/xt/bin"
          sudo -E env "PATH=$PATH" E2E_WORK="$RUNNER_TEMP/e2e4k" E2E_SIZE_MB=512 E2E_SECTOR=4096 \
            engine/tests/e2e_linux.sh "$RUNNER_TEMP/xt/bin"

  engine-macos:
    name: Engine (macOS universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Cached engine
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/engine/bin
          key: engine-macos-${{ hashFiles('engine/**') }}
      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install autoconf automake libtool pkgconf libgcrypt
      - name: Fetch macFUSE SDK
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci-run.sh engine/fetch-macfuse-sdk.sh "$RUNNER_TEMP/macfuse"
      - name: Build engine
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MACFUSE_PREFIX: ${{ runner.temp }}/macfuse
        run: scripts/ci-run.sh engine/build-ntfs3g.sh "$RUNNER_TEMP/engine"
      - name: Check engine
        run: |
          ls -l "$RUNNER_TEMP/engine/bin"
          lipo -info "$RUNNER_TEMP/engine/bin/ntfs-3g"
          otool -L "$RUNNER_TEMP/engine/bin/ntfs-3g"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-macos
          path: ${{ runner.temp }}/engine/bin/
          if-no-files-found: error

  app:
    name: App + DMG
    runs-on: macos-15
    needs: [engine-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: engine-macos
          path: ${{ runner.temp }}/engine
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" || true
          xcodebuild -version
          swift --version
      - name: Unit tests
        run: scripts/ci-run.sh swift test
      - name: Build app
        run: |
          chmod +x "$RUNNER_TEMP"/engine/* || true
          scripts/ci-run.sh scripts/build-app.sh "$RUNNER_TEMP/engine" build
      - name: Make DMG
        id: dmg
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          DMG="build/XT-NTFS-$VERSION.dmg"
          scripts/ci-run.sh scripts/make-dmg.sh "build/XT NTFS.app" "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: Smoke and integration test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHOTS="$RUNNER_TEMP/shots"
          mkdir -p "$SHOTS"
          APP="$PWD/build/XT NTFS.app"
          open "$APP"
          sleep 15
          pgrep -fl "XT NTFS.app/Contents/MacOS/XTNTFS" | tee "$SHOTS/processes.txt"
          screencapture -x "$SHOTS/main.png" || true
          osascript -e 'quit app "XT NTFS"' || pkill -f "XT NTFS.app/Contents/MacOS/XTNTFS" || true
          sleep 3
          open "$APP" --args -XTSelect engine
          sleep 12
          screencapture -x "$SHOTS/engine.png" || true
          pkill -f "XT NTFS.app/Contents/MacOS/XTNTFS" || true
          sleep 2
          scripts/ci-integration.sh "$APP" "$SHOTS" && result=0 || result=$?
          cd "$SHOTS"
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screens
          exit $result
      - uses: actions/upload-artifact@v4
        with:
          name: XT-NTFS-dmg
          path: ${{ steps.dmg.outputs.dmg }}
          if-no-files-found: error
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "${GITHUB_REF_NAME#v}" = "${{ steps.dmg.outputs.version }}" || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION ${{ steps.dmg.outputs.version }}"; exit 1; }
      - name: Sign update and create appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="${{ steps.dmg.outputs.dmg }}"
          NAME="$(basename "$DMG")"
          (cd build && shasum -a 256 "$NAME" > "$NAME.sha256")
          if [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            python3 -m pip install --quiet --break-system-packages cryptography || python3 -m pip install --quiet cryptography
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${NAME}"
            python3 scripts/make-appcast.py "$DMG" "${{ steps.dmg.outputs.version }}" "${{ steps.dmg.outputs.build }}" "$URL" build/appcast.xml
          else
            # Without the signing key the update cannot be offered in-app.
            # Keep the feed pointing at the previous signed release.
            echo "::warning title=Sparkle::SPARKLE_ED_PRIVATE_KEY secret is not set; this release is not offered as an in-app update."
            prev="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '[.[] | select(.draft == false and .tag_name != env.GITHUB_REF_NAME)][0].tag_name' 2>/dev/null || true)"
            if [ -n "$prev" ] && [ "$prev" != "null" ]; then
              gh release download "$prev" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir build || true
            fi
          fi
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="${{ steps.dmg.outputs.dmg }}"
          NOTES="build/release-notes.md"
          python3 scripts/release-notes.py "${{ steps.dmg.outputs.version }}" > "$NOTES"
          # Fixed-name copy so https://github.com/<repo>/releases/latest/download/XT-NTFS.dmg always works.
          cp "$DMG" build/XT-NTFS.dmg
          ASSETS=("$DMG" "$DMG.sha256" build/XT-NTFS.dmg)
          [ -f build/appcast.xml ] && ASSETS+=(build/appcast.xml)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "XT NTFS ${{ steps.dmg.outputs.version }}" --notes-file "$NOTES"
          fi

  pages:
    name: Website (GitHub Pages)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish docs/ to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SITE="$RUNNER_TEMP/site"
          cp -R docs "$SITE"
          # Mirror the current update feed on the website as well.
          gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir "$SITE" 2>/dev/null || true
          cd "$SITE"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
